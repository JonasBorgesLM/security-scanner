name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check gofmt formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      # Known vulnerabilities in what we ship. It sits with the other
      # static gates rather than with the tests because it asks the same
      # kind of question: a tool reading the code, with no service to
      # stand up and nothing to flake.
      #
      # A scanner that reports other people's vulnerable dependencies
      # while carrying its own is not a tool anyone should trust.
      #
      # Pinned rather than @latest so the gate is reproducible: the same
      # commit must not pass today and fail tomorrow because the tool
      # changed underneath it. Only the vulnerability database moves, and
      # that movement is the point.
      #
      # Fail-closed on an *actionable* finding is govulncheck's own
      # default, not something configured here: it exits non-zero only
      # for a vulnerability the code can actually reach. Something
      # present in the dependency graph but never called exits 0. The
      # trade accepted with that: an advisory against the standard
      # library can block merges until a Go release fixes it.
      - name: Vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Test with coverage
        run: go test -cover ./...
