# Example configuration for the scanner.
#
# Copy this file, point it at YOUR OWN lab API, and export the secrets it
# references before running:
#
#   export LAB_PASSWORD='...'
#   scanner scan --spec openapi.yaml --config configs/config.yaml
#
# scope.allowed_hosts is the hard security boundary: any request to a host
# not listed here is rejected before it leaves the process. The scanner also
# refuses to start if target.base_url's host is missing from the list.

schema_version: 1

target:
  # Base URL of the API under test. Must be an absolute URL.
  base_url: http://localhost:8080

scope:
  # Exact host[:port] values, matched against each request URL's host.
  # Include every alias you might reach the lab through.
  allowed_hosts:
    - "localhost:8080"
    - "127.0.0.1:8080"

# Optional. Omit this whole block for a target whose spec declares no
# protected routes. If you keep it, it is all-or-nothing: login_endpoint,
# token_path, credentials.username and credentials.password must all be set.
auth:
  # Resolved against target.base_url.
  login_endpoint: /login
  method: POST
  credentials:
    username: admin
    # Never commit a real credential. ${VAR} is read from the environment
    # and the scanner fails with a clear error if the variable is unset.
    password: ${LAB_PASSWORD}
    # Optional. JSON key `username` is sent under in the login body.
    # Defaults to "username"; set to e.g. "email" for a target that logs
    # in by email address.
    # username_field: email
  # Dot-notation path to the token inside the JSON login response.
  # For {"data": {"access_token": "..."}} this is data.access_token
  # Optional second account, for checks that must ask a question as somebody
  # else — today only idor, which tries one user's resource with another
  # user's session. It logs in through the same endpoint with the same token
  # handling; only the credentials differ.
  # secondary_credentials:
  #   username: other@example.com
  #   password: ${LAB_PASSWORD_2}
  token_path: data.access_token
  token_header: Authorization
  token_prefix: "Bearer "
  # Optional. Set only on the login request itself, before any token
  # exists. Useful against a target whose CSRF defense is keyed on
  # "Authorization present or not" rather than on the credential's real
  # value — the scanner's own login attempt otherwise looks identical to
  # an unauthenticated browser request such a defense exists to block.
  # extra_headers:
  #   Authorization: "Bearer bootstrap"

engine:
  # Worker pool size and rate limit — keep these gentle; the point is to
  # avoid self-DoS-ing your own lab.
  max_concurrency: 5
  requests_per_second: 10
  # Global deadline for the whole run (Go duration: 30s, 5m, 1h...).
  timeout: 5m
  # Optional. Bounds ONE request, where timeout above bounds the whole run.
  # Without it the two are the same number, so a handful of routes that
  # accept a connection and never answer hold every worker until the global
  # deadline fires — and the run is then thrown away as incomplete.
  # Defaults to 30s when unset. Must not exceed timeout.
  # request_timeout: 30s
  # DELETE/PUT/PATCH endpoints are skipped unless this is true.
  # Leave it false unless you can restore the lab's state afterwards.
  test_destructive: false
  # Opt in to sending a request body, which lets the active checks probe
  # POST routes that require one. Off by default, and separate from
  # test_destructive on purpose: creating is recoverable and deleting is not,
  # so wanting coverage on POST should not force switching on DELETE/PUT/PATCH.
  #
  # Switching it on means probes start CREATING resources. Against a spec
  # with five POST routes that take a body, expect a few hundred created
  # records per scan — and read what those routes do first: a password-change
  # endpoint probed with a valid body will end the scanner's own session.
  test_creates: false

checks:
  # Names of registered checks to run.
  # Only names the binary actually knows are accepted; a typo aborts the run
  # instead of silently disabling a check.
  enabled:
    - missing-headers
    - exposed-secrets
    - sqli-boolean
    - xss-reflected
    # Asks whether a route the spec declares as protected actually is. Only
    # runs against those routes, and sends no body — see its doc comment for
    # why that costs a verdict on some POST routes and is worth it.
    - auth-required
    # Reports authenticated responses a cache may keep. Passive: it reads the
    # Cache-Control of the baseline that was already collected.
    - cache-on-authenticated
    # Reads the origin probe collection gathers. Note the inverted logic:
    # a route with no CORS headers is SECURE and produces no finding.
    - cors-misconfigured
    # Sends one TRACE per endpoint, anonymously. Low severity on purpose:
    # Cross-Site Tracing has not been reachable since browsers stopped
    # letting script issue TRACE — what is left is information disclosure.
    - dangerous-http-methods
    # Needs auth.secondary_credentials; skips with that reason when absent.
    - idor
    # Inspects the scanner's own token: alg:none acceptance (critical, with
    # a PoC) and a missing/overlong exp (low, structural). Skips when the
    # token is not a JWT.
    - jwt-weak
    # Sends one malformed value per parameter, looking for internal detail
    # (stack traces, raw SQL, filesystem paths) in the response that the
    # normal response does not contain.
    - verbose-errors
    # Plants an external URL in redirect-shaped parameters and reports one
    # the response would bounce a browser to. Only runs where such a
    # parameter exists.
    - open-redirect
