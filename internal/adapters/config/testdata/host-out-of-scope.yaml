schema_version: 1
target:
  base_url: http://localhost:8080
scope:
  allowed_hosts: ["only-this-other-host.invalid:9999"]
auth:
  login_endpoint: /login
  credentials:
    username: admin
    password: hardcoded-for-this-fixture
  token_path: data.access_token
engine:
  max_concurrency: 5
  requests_per_second: 10
  timeout: 5m
checks:
  enabled: [missing-headers]
