schema_version: 1
target:
  base_url: http://localhost:8080
scope:
  allowed_hosts: ["localhost:8080"]
auth:
  login_endpoint: /login
  credentials:
    username: admin
    password: ${SCANNER_TEST_DEFINITELY_UNSET_VAR}
  token_path: data.access_token
engine:
  max_concurrency: 5
  requests_per_second: 10
  timeout: 5m
checks:
  enabled: [missing-headers]
